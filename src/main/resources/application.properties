# Application Configuration
spring.application.name=key-management-service

# Server Configuration
server.port=8080

# Logging Configuration
# Ensure sensitive data is never logged
logging.level.root=INFO
logging.level.com.keymanagement=INFO

# Disable logging of request/response bodies to prevent leaking sensitive data
logging.level.org.springframework.web=WARN

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/kms_db
spring.datasource.username=kms_user
spring.datasource.password=kms_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# DevTools Configuration
# Enable automatic restart when classpath files change
spring.devtools.restart.enabled=true
# Enable LiveReload server
spring.devtools.livereload.enabled=true
# Log condition evaluation changes for debugging
spring.devtools.restart.log-condition-evaluation-delta=false
# Exclude certain paths from triggering restart (if needed)
# spring.devtools.restart.exclude=static/**,public/**
