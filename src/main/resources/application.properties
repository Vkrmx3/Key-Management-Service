# Application Configuration
spring.application.name=key-management-service

# Server Configuration
server.port=8080

# Logging Configuration
# Ensure sensitive data is never logged
logging.level.root=INFO
logging.level.com.keymanagement=INFO

# Disable logging of request/response bodies to prevent leaking sensitive data
logging.level.org.springframework.web=WARN

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# Database Configuration - PostgreSQL
# Use environment variables in production, fallback to defaults for local development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kms_db}
spring.datasource.username=${DB_USERNAME:kms_user}
spring.datasource.password=${DB_PASSWORD:kms_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# DevTools Configuration
# Enable automatic restart when classpath files change
spring.devtools.restart.enabled=true
# Enable LiveReload server
spring.devtools.livereload.enabled=true
# Log condition evaluation changes for debugging
spring.devtools.restart.log-condition-evaluation-delta=false
# Exclude certain paths from triggering restart (if needed)
# spring.devtools.restart.exclude=static/**,public/**

# JWT Configuration
# Use environment variables in production for security
# Secret key for JWT signing - Minimum 256 bits (32 characters) required for HMAC-SHA256
# Generate secure key: openssl rand -base64 32 (Linux/Mac) or [Convert]::ToBase64String((1..32|%{Get-Random -Max 256})) (PowerShell)
jwt.secret=${JWT_SECRET:vClmNcZMTSJWfPSLSMjVYpIzsy69WVPlrujBOlAmnNY=}
# Token expiration time in milliseconds (default: 24 hours = 86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Configuration
# Expose health endpoint for monitoring and CI/CD health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
