name: CD - Build and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "Image signing would happen here with cosign"
          # cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://kms-staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          
          # Example deployment commands (customize for your infrastructure):
          # kubectl set image deployment/kms kms=${{ needs.build-and-push.outputs.image-tag }}
          # kubectl rollout status deployment/kms
          
          # Or using docker-compose on remote host:
          # ssh deploy@staging.example.com "cd /opt/kms && docker compose pull && docker compose up -d"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://kms-staging.example.com/actuator/health || exit 1
          # Add more smoke tests here

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed"
          # Send notification to Slack/Teams/Discord

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://kms.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          
          # Example deployment commands (customize for your infrastructure):
          # kubectl set image deployment/kms kms=${{ needs.build-and-push.outputs.image-tag }} -n production
          # kubectl rollout status deployment/kms -n production
          
          # Blue-green deployment example:
          # kubectl apply -f k8s/production/
          # kubectl wait --for=condition=available --timeout=300s deployment/kms-green -n production
          # kubectl patch service kms -n production -p '{"spec":{"selector":{"version":"green"}}}'

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."
          # curl -f https://kms.example.com/actuator/health || exit 1
          # Add more smoke tests here

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            
            Docker Image: `${{ needs.build-and-push.outputs.image-tag }}`
            Image Digest: `${{ needs.build-and-push.outputs.image-digest }}`
            
            ## Deployment
            
            ```bash
            docker pull ${{ needs.build-and-push.outputs.image-tag }}
            ```
            
            See [DOCKER.md](DOCKER.md) for deployment instructions.
          draft: false
          prerelease: false

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment completed"
          # Send notification to Slack/Teams/Discord

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    environment:
      name: production

    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back production deployment..."
          # kubectl rollout undo deployment/kms -n production
          # Or restore previous docker-compose version
